<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Bootstrap Page</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #d2b48c;
        }
            .bg-brown {
                background-color: #6f4e37;
        }
            .bg-cream {
                background-color: #f5f0e1;
        }
            .btn-cream {
                background-color: #f5f0e1;
                color: #4a3426;
        }
            .btn-cream:hover {
                background-color: #d2b48c;
                color: #4a3426;
        }
    </style>
</head>


<body>



<div class="container-fluid p-5 bg-brown text-white text-center">
    <h1>My First Bootstrap Page</h1>
    <p>Resize this page to see it change!</p>
</div>

<div class="container mt-5 p-4 bg-cream">
    <div class="row">
        <div class="col-sm-4">
        <h3>Column 1</h3>
        <p>This is the first column.</p>
    </div>
    <div class="col-sm-4">
        <h3>Column 2</h3>
        <p>This is the second column.</p>
    </div>
    <div class="col-sm-4">
        <h3>Column 3</h3>
        <p>This is the third column.</p>
    </div>
  </div>
</div>

<div class="container mt-4 mb-5 p-4 bg-brown">
    <button type="button" class="btn btn-cream">Success</button>
    <button type="button" class="btn btn-cream">Danger</button>
</div>

</body>
</html>
